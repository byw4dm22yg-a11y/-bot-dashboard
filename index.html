<style>

<script>
const $=id=>document.getElementById(id);
const mem={};let SAMPLE=false;
const STOCK_START=5000,VUSA_START=109.91;
function parseCSV(t){let rows=[],r=[],f="",q=false;t=t.replace(/\r/g,"");
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}

 const h=rows[0].map(x=>x.trim());return rows.slice(1).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])));}
const num=v=>{const x=parseFloat(String(v).replace(/[£$,%]/g,""));return isNaN(x)?null:x};
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const money=(n,c)=>c+(n>=100?Math.round(n).toLocaleString():n.toFixed(2));
// ---- sample data (preview only) ----
function sampleData(){let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;const now=Date.now(),iso=t=>new Date(t).toISOString();
 const walk=(n,drift,vol)=>{let v=0,a=[];for(let i=0;i<n;i++){v+=drift+(R()-.5)*vol;a.push(v)}return a};
 const csv=(h,rows)=>h.join(",")+"\n"+rows.map(r=>r.join(",")).join("\n");
 const stk=walk(40,-.002,.5),vus=walk(40,-.02,.9);
 const se=csv(["time_utc","account_gbp","vusa_gbp"],stk.map((v,i)=>[iso(now-(40-i)*3600e3),(STOCK_START*(1+v/100)).toFixed(2),(VUSA_START*(1+vus[i]/100)).toFixed(2)]));
 const cr=walk(60,0,.25),bt=walk(60,-.02,1.1),fa=walk(80,.01,.5),fb=walk(80,-.01,1.1);
 const eqc=(a,b,n,step)=>csv(["time_utc","equity_usd","cash_usd","btc_price","btc_hold_usd","bot_vs_hold_pct"],a.map((v,i)=>[iso(now-(n-i)*step),(1000*(1+v/100)).toFixed(2),900,70000,(1000*(1+b[i]/100)).toFixed(2),0]));
 const ft=csv(["time_utc","coin","side","qty","price","fee_usd","usd","rule","reason"],[[iso(now-8e6),"FIL","buy",100,.948,.1,100,"breakout","x"],[iso(now-6e6),"FIL","sell",100,.928,.1,98,"stop loss","x"],[iso(now-4e6),"XMR","buy",.17,594.5,.1,100,"breakout","x"],[iso(now-2e6),"XMR","sell",.17,593.2,.1,99.7,"trailing stop","x"],[iso(now-5e5),"FET","buy",560,.1762,.1,100,"breakout","x"]]);
 const st=csv(["time_utc","symbol","action","qty","price","reason","dry_run"],[[iso(now-9e7),"MSFT","buy",.28,532.02,"All four buy rules met","False"],[iso(now-6e7),"NVDA","sell",.69,221.23,"Price fell below its 50-day average","False"],[iso(now-3e7),"PLTR","buy",.38,196.57,"All four buy rules met","False"],[iso(now-1e7),"DDOG","buy",.28,272.28,"All four buy rules met","False"]]);
 const ct=csv(["time_utc","coin","side","qty","price","fee_usd","usd","rule","confidence","reason"],[]);
 const dc=csv(["time_utc","coin","action","usd_amount","confidence","outcome","reason"],[[iso(now-4e6),"BTC","hold",0,.5,"hold","Price below 50-day average"],[iso(now-4e6),"ETH","hold",0,.5,"hold","No trend yet"]]);
 return{se,eq:eqc(cr,bt,60,4*3600e3),fe:eqc(fa,fb,80,1800e3),ft,st,ct,dc}}
// ---- helpers ----
function series(rows,a,b){if(!rows.length)return[];const e0=num(rows[0][a]),b0=num(rows[0][b]);return rows.map(r=>[(num(r[a])/e0-1)*100,(num(r[b])/b0-1)*100]).filter(p=>!isNaN(p[0])&&!isNaN(p[1]))}
function chart(c,pts,full){if(!c||pts.length<2)return;const x=c.getContext("2d"),w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2;x.clearRect(0,0,w,h);
 const all=(full||pts).flat().concat(0),mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1,Y=v=>h-14-(v-mn)/rg*(h-28),X=i=>6+i/(pts.length-1)*(w-12);
 x.setLineDash([4,8]);x.lineWidth=1;x.strokeStyle="#1b3348";x.beginPath();x.moveTo(0,Y(0));x.lineTo(w,Y(0));x.stroke();

 line(1,"#f4f2ff",true,false);
 const GR="#38e08c",RD="#ff5d73",seg=(x0,y0,x1,y1,col)=>{x.beginPath();x.setLineDash([]);x.lineWidth=4;x.lineCap="round";x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=16;x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();x.shadowBlur=0};
 const cur=pts[pts.length-1][0]>=pts[pts.length-1][1]?GR:RD;for(let i=1;i<pts.length;i++)seg(X(i-1),Y(pts[i-1][0]),X(i),Y(pts[i][0]),cur);

function table(rows,cols,heads,max){if(!rows.length)return'<div class="empty">Nothing yet.</div>';
 return'<div class="tw"><table><tr>'+heads.map(h=>"<th>"+h+"</th>").join("")+"</tr>"+rows.slice(-max).reverse().map(r=>"<tr>"+cols.map(k=>{let v=r[k]==null?"":r[k];
  if(/^buy$/i.test(v))v='<span class="up">buy</span>';else if(/^sell$/i.test(v))v='<span class="down">sell</span>';else if((k==="price"||k==="usd")&&v!==""&&!isNaN(parseFloat(v)))v="£"+gbp(v);else v=esc(k==="time_utc"?v.replace("T"," ").slice(0,16):v);return"<td>"+v+"</td>"}).join("")+"</tr>").join("")+"</table></div>"}
// crypto prices come in US dollars; shown in pounds at an approximate rate (change FX if the rate moves)
const FX=0.75,gbp=v=>{const n=parseFloat(v);return isNaN(n)?esc(v):String(Number((n*FX).toPrecision(4)))};
let TAB=null,POS={closed:[],open:[]};
function positions(d){const out={closed:[],open:[]};
 [["stock",d.st,"symbol","action"],["crypto",d.ct,"coin","side"],["fast",d.ft,"coin","side"],["trend",d.tt,"coin","side"]].forEach(([bot,rows,sym,side])=>{const open={};
  rows.slice().sort((a,b)=>(ts(a.time_utc)||0)-(ts(b.time_utc)||0)).forEach(r=>{const s=r[sym],p=num(r.price),b=/buy/i.test(r[side]||"");if(p==null||!s)return;
   if(b)open[s]={t:ts(r.time_utc),p};else if(open[s]){const o=open[s];out.closed.push({bot,coin:s,tb:o.t,ts:ts(r.time_utc),pb:o.p,ps:p,pct:(p/o.p-1)*100,rule:r.rule});delete open[s]}});
  Object.keys(open).forEach(s=>out.open.push({bot,coin:s,tb:open[s].t,pb:open[s].p}))});
 out.closed.sort((a,b)=>(b.ts||0)-(a.ts||0));out.open.sort((a,b)=>(b.tb||0)-(a.tb||0));return out}
function showPos(){const el=$("posdet");if(!el)return;document.querySelectorAll("#tiles .tb").forEach(b=>b.classList.toggle("on",b.dataset.t===TAB));

 const px=(o,p)=>o.bot==="stock"?"":"£"+gbp(p),list=POS[TAB];
