<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<div class="wrap">
<div id="hero"><canvas id="bh"></canvas>
<div class="title"><div><h1>Ace</h1><div class="sub">How your three AI bots are doing</div></div><div id="scanlbl"></div></div></div>
<div id="out"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const mem={};let LABEL='Loading ...';
const words=['Updating','Checking trades','Checking prices','Comparing to the market'];
const get=k=>mem[k]||"";
function parseCSV(t){let rows=[];let r=[],f="",q=false;t=t.replace(/\r/g,"");
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=""}else f+=c}
 if(f||r.length){r.push(f);rows.push(r)}
 rows=rows.filter(x=>x.some(y=>y.trim()));
 if(!rows.length)return[];const h=rows[0].map(x=>x.trim());
 return rows.slice(1).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])));}
const num=v=>{const x=parseFloat(String(v).replace(/[£$,%]/g,""));return isNaN(x)?null:x};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=(x,d)=>(x>=0?'+':'')+x.toFixed(d);
function table(rows,cols,heads,max){
 if(!rows.length)return'<div class="empty">Nothing yet.</div>';
 const last=rows.slice(-max).reverse();
 return'<div class="tw"><table><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+
 last.map(r=>'<tr>'+cols.map(k=>{let v=r[k]==null?'':r[k];
  if(/^(buy|BUY)$/.test(v))v='<span class="pos">buy</span>';else if(/^(sell|SELL)$/.test(v))v='<span class="neg">sell</span>';else v=esc(k==='time_utc'||k==='time'?v.replace('T',' ').slice(0,16):v);
  return'<td>'+v+'</td>'}).join('')+'</tr>').join('')+'</table></div>'}
function spark(c,a,b){if(!c||a.length<2)return;const ctx=c.getContext('2d');const w=c.width=c.clientWidth*2,h=c.height=c.clientHeight*2;ctx.clearRect(0,0,w,h);
 const all=a.concat(b);const mn=Math.min(...all,0),mx=Math.max(...all,0),rg=(mx-mn)||1;const Y=v=>h-10-(v-mn)/rg*(h-20);
 ctx.setLineDash([4,8]);ctx.lineWidth=1;ctx.strokeStyle='#1a2b44';ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(w,Y(0));ctx.stroke();
 const line=(arr,st,dash,glow)=>{ctx.beginPath();ctx.setLineDash(dash?[10,9]:[]);ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=st;ctx.shadowColor=glow?'#2f8cff':'transparent';ctx.shadowBlur=glow?16:0;
  arr.forEach((v,i)=>{const x=i/(arr.length-1)*(w-10)+5,y=Y(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.shadowBlur=0};
 if(b.length>1)line(b,'#e6edf7',true,false);
 const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,'#6fb8ff');g.addColorStop(1,'#2f8cff');line(a,g,false,true)}
function render(){
 const se=parseCSV(get('se')),eq=parseCSV(get('eq')),ct=parseCSV(get('ct')),dc=parseCSV(get('dc')),st=parseCSV(get('st')),fe=parseCSV(get('fe')),ft=parseCSV(get('ft'));
 const sp=se.map(r=>({v:num(r.account_gbp),b:num(r.vusa_gbp)})).filter(p=>p.v!=null&&p.b!=null);
 let h='';
 h+='<div class="card"><h2>Stock bot (Trading 212 practice account)</h2><p class="lead">Compared with simply putting the money in VUSA, a market-tracking fund.</p>';
 let sv=[],sb=[];
 if(sp.length){const l=sp[sp.length-1],ai=(l.v/5000-1)*100,vu=(l.b/109.91-1)*100;
  sv=[0].concat(sp.map(p=>(p.v/5000-1)*100));sb=[0].concat(sp.map(p=>(p.b/109.91-1)*100));
  h+='<div class="row"><div><div class="hint">Stock bot</div><div class="big'+(ai<0?' neg':'')+'">'+fmt(ai,2)+'%</div></div><div><div class="hint">VUSA (the market)</div><div class="big dim">'+fmt(vu,2)+'%</div></div></div><div class="hint">Started with £5,000, now about £'+Math.round(l.v).toLocaleString()+'</div><canvas class="ch" id="c1"></canvas><div class="hint">Blue line = stock bot. White dashed = VUSA. Higher is better.</div><div class="verdict'+(ai<vu?' bad':'')+'">'+(ai>=vu?'<b>Ahead</b> of the market by '+(ai-vu).toFixed(2)+' points.':'<b>Behind</b> the market by '+(vu-ai).toFixed(2)+' points.')+'</div>'}
 else h+='<div class="empty">Waiting for the stock bot\'s first update. It appears after its next run.</div>';
 h+='</div>';
 h+='<div class="card"><h2>Crypto bot (pretend $1,000)</h2><p class="lead">Compared with just buying Bitcoin on day one and doing nothing.</p>';
 let ea=[],eb=[];
 if(eq.length){const l=eq[eq.length-1],e=num(l.equity_usd),b=num(l.btc_hold_usd),d=(e!=null&&b)?(e/b-1)*100:null;
  const e0=num(eq[0].equity_usd),b0=num(eq[0].btc_hold_usd);
  ea=eq.map(r=>(num(r.equity_usd)/e0-1)*100);eb=eq.map(r=>(num(r.btc_hold_usd)/b0-1)*100);
  h+='<div class="row"><div><div class="hint">Crypto bot is worth</div><div class="big">$'+(e==null?'?':e.toFixed(0))+'</div></div><div><div class="hint">Just holding Bitcoin</div><div class="big dim">$'+(b==null?'?':b.toFixed(0))+'</div></div></div><canvas class="ch" id="c2"></canvas><div class="hint">Blue line = crypto bot. White dashed = holding Bitcoin. Higher is better. '+eq.length+' check-ins so far.</div>';
  if(d!=null)h+='<div class="verdict'+(d<0?' bad':'')+'">'+(d>=0?'<b>Ahead</b> of holding Bitcoin by '+d.toFixed(2)+'%.':'<b>Behind</b> holding Bitcoin by '+(-d).toFixed(2)+'%.')+'</div>'}
 else h+='<div class="empty">Waiting for the crypto bot\'s first update.</div>';
 h+='</div>';
 h+='<div class="card"><h2>Fast bot (pretend $1,000)</h2><p class="lead">Trades quickly on 15-minute prices using fixed rules, no AI. Compared with holding Bitcoin.</p>';
 let fa=[],fb=[];
 if(fe.length){const l=fe[fe.length-1],e=num(l.equity_usd),b=num(l.btc_hold_usd),d=(e!=null&&b)?(e/b-1)*100:null;
  const e0=num(fe[0].equity_usd),b0=num(fe[0].btc_hold_usd);
  fa=fe.map(r=>(num(r.equity_usd)/e0-1)*100);fb=fe.map(r=>(num(r.btc_hold_usd)/b0-1)*100);
  h+='<div class="row"><div><div class="hint">Fast bot is worth</div><div class="big">$'+(e==null?'?':e.toFixed(0))+'</div></div><div><div class="hint">Just holding Bitcoin</div><div class="big dim">$'+(b==null?'?':b.toFixed(0))+'</div></div></div><canvas class="ch" id="c3"></canvas><div class="hint">Blue line = fast bot. White dashed = holding Bitcoin. '+fe.length+' check-ins so far.</div>';
  if(d!=null)h+='<div class="verdict'+(d<0?' bad':'')+'">'+(d>=0?'<b>Ahead</b> of holding Bitcoin by '+d.toFixed(2)+'%.':'<b>Behind</b> holding Bitcoin by '+(-d).toFixed(2)+'%.')+'</div>'}
 else h+='<div class="empty">Waiting for the fast bot\'s first update.</div>';
 h+='</div>';
 h+='<div class="card"><h2>Fast bot trades</h2><p class="lead">Each pretend buy or sell, with the rule that triggered it.</p>'+table(ft,['time_utc','coin','side','price','usd','rule'],['When','Coin','Buy/Sell','Price','Total $','Rule'],50)+'</div>';
 h+='<div class="card"><h2>Latest crypto trades</h2><p class="lead">Each pretend buy or sell the crypto bot made.</p>'+table(ct,['time_utc','coin','side','qty','price','fee_usd','usd'],['When','Coin','Buy/Sell','Amount','Price','Fee','Total $'],50)+'</div>';
 h+='<div class="card"><h2>Why the crypto bot decided</h2><p class="lead">Its reasoning at each check, newest first.</p>'+table(dc,['time_utc','coin','action','outcome','reason'],['When','Coin','Decision','Result','Reason'],40)+'</div>';
 if(st.length)h+='<div class="card"><h2>Latest stock trades</h2><p class="lead">Each trade the stock bot made on the practice account.</p>'+table(st,Object.keys(st[0]),Object.keys(st[0]),50)+'</div>';
 $('out').innerHTML=h;
 spark($('c1'),sv,sb);spark($('c2'),ea,eb);spark($('c3'),fa,fb);
 LABEL='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
// ---------- black hole ----------
const cv=$('bh'),cx=cv.getContext('2d');
const N=2600,P=[];for(let i=0;i<N;i++){const u=Math.random();P.push({r:1.55+Math.pow(u,1.6)*3.6,a:Math.random()*6.283,s:Math.random(),z:Math.random()})}
const stars=Array.from({length:70},()=>({a:Math.random()*6.283,r:3+Math.random()*5,v:.004+Math.random()*.006}));
let t=0;function frame(){
 const W=cv.width=cv.clientWidth*2,H=cv.height=cv.clientHeight*2;cx.clearRect(0,0,W,H);
 const X=W/2,Yc=H*.46,R=Math.min(W,H)*.105,tilt=.3;
 // far stars
 cx.fillStyle='#fff';for(let i=0;i<60;i++){const sx=(i*977%W),sy=(i*541%H),tw=.35+.35*Math.sin(t*.02+i);cx.globalAlpha=tw*.6;cx.fillRect(sx,sy,2,2)}cx.globalAlpha=1;
 // halo glow
 let g=cx.createRadialGradient(X,Yc,R*.9,X,Yc,R*6);g.addColorStop(0,'rgba(47,140,255,.32)');g.addColorStop(.35,'rgba(100,80,255,.10)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 const draw=(front)=>{for(const p of P){const ang=p.a;const sn=Math.sin(ang);if((sn>0)!==front)continue;
   const rr=p.r*R;const x=X+Math.cos(ang)*rr,y=Yc+sn*rr*tilt;
   const dop=.5+.5*Math.cos(ang+.5);const heat=1-(p.r-1.55)/3.6;
   const al=Math.min(1,(.3+.9*dop)*(.4+.7*heat));
   const R1=Math.round(40+190*heat*heat),G1=Math.round(120+110*heat),B1=255;
   cx.fillStyle='rgba('+R1+','+G1+','+B1+','+al+')';const sz=1.6+p.z*3*(front?1.2:1);cx.fillRect(x,y,sz,sz)}};
 draw(false);
 // lensed halo over top and under bottom
 cx.lineWidth=3;for(let k=0;k<3;k++){cx.strokeStyle='rgba('+(90+k*50)+','+(170+k*30)+',255,'+(.5-k*.14)+')';cx.beginPath();cx.ellipse(X,Yc,R*(1.35+k*.18),R*(1.35+k*.18)*.98,0,Math.PI*1.02,Math.PI*1.98);cx.stroke()}
 cx.strokeStyle='rgba(120,190,255,.30)';cx.lineWidth=2;cx.beginPath();cx.ellipse(X,Yc,R*1.55,R*1.1,0,.1,Math.PI-.1);cx.stroke();
 // event horizon
 g=cx.createRadialGradient(X,Yc,R*.75,X,Yc,R*1.12);g.addColorStop(0,'#000');g.addColorStop(.85,'#000');g.addColorStop(1,'rgba(170,220,255,.9)');
 cx.fillStyle=g;cx.beginPath();cx.arc(X,Yc,R*1.08,0,6.283);cx.fill();
 cx.fillStyle='#000';cx.beginPath();cx.arc(X,Yc,R,0,6.283);cx.fill();
 draw(true);
 // infalling stars
 for(const s of stars){s.a+=s.v*3;s.r-=.006;if(s.r<1.1){s.r=6+Math.random()*3;s.a=Math.random()*6.283}
   const x=X+Math.cos(s.a)*s.r*R,y=Yc+Math.sin(s.a)*s.r*R*.5;cx.fillStyle='rgba(220,240,255,'+Math.min(1,(s.r-1)/2)+')';cx.fillRect(x,y,2.4,2.4)}
 for(const p of P){p.a+=.0032/Math.pow(p.r,1.5)*5}
 t++;$('scanlbl').textContent=LABEL;
 requestAnimationFrame(frame)}

async function pull(){
 const f={se:'data/stock_equity.csv',eq:'data/crypto_equity.csv',ct:'data/crypto_trades.csv',dc:'data/crypto_decisions.csv',st:'data/stock_trades.csv',fe:'data/fast_equity.csv',ft:'data/fast_trades.csv'};
 for(const k in f){try{const r=await fetch(f[k]+'?t='+Date.now());if(r.ok)mem[k]=await r.text();}catch(e){}}
 render();
}
render();frame();pull();setInterval(pull,300000);
</script></body></html>
